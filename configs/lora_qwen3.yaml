# LoRA Fine-tuning Config for Qwen3
base_model: Qwen/Qwen3-8B

# Dataset
dataset_path: ./data/alpaca_zh.jsonl
template: alpaca
max_seq_length: 2048

# Training
batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 3
learning_rate: 2.0e-4
warmup_ratio: 0.03
lr_scheduler_type: cosine
weight_decay: 0.001
max_grad_norm: 0.3

# LoRA
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

# QLoRA 4-bit (set to false for full LoRA on 16GB+ VRAM)
qlora:
  enabled: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: nf4

# Output
output_dir: ./outputs/qwen3_lora
logging_steps: 10
save_steps: 200
save_total_limit: 3
bf16: true
fp16: false
